# Builds the APK on GitHub (free) and puts it under "Artifacts" for download.
# Works even if the project was uploaded inside a sub-folder (e.g. FEA-Android/).
name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (uses the SDK already on GitHub's machine)
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1)
          echo "sdkmanager: $SM"
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses > /dev/null || true
            "$SM" "platform-tools" "platforms;android-35" "build-tools;35.0.0" || echo "::warning::sdkmanager could not install packages; Gradle will try to download them."
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Find the project folder
        id: proj
        run: |
          F=$(find . -name settings.gradle -not -path '*/node_modules/*' | head -n 1)
          if [ -z "$F" ]; then
            echo "::error::settings.gradle was not found. Upload the CONTENTS of the FEA-Android folder."
            echo "### ❌ settings.gradle not found — upload the contents of the FEA-Android folder" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          D=$(dirname "$F")
          echo "dir=$D" >> $GITHUB_OUTPUT
          echo "Project folder: $D"
          ls -la "$D" "$D/app" || true

      - name: Prepare
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          # do not let lint warnings stop the release build
          printf '\nandroid { lint { checkReleaseBuilds false\n abortOnError false } }\n' >> app/build.gradle
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ ! -f fea-release.jks ]; then
            echo "::warning::fea-release.jks missing — creating a new signing key (keep it for future updates)."
            keytool -genkeypair -v -keystore fea-release.jks -alias fea -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass 'FeaSystem2026!' -keypass 'FeaSystem2026!' -dname "CN=FEA, O=Faculty of Economics and Administration, C=LY"
          fi

      - name: Build signed APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log || {
            echo "### ❌ Build failed — last lines:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "error:|ERROR|FAILURE|What went wrong|Caused by|> " build.log | tail -n 40 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/FEA-System.apk"
          echo "### ✅ APK ready — download FEA-System-APK below (Artifacts)" >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: FEA-System-APK
          path: FEA-System.apk
